services:
  - type: web
    name: apzbot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: TZ
        value: Europe/Kyiv
      - key: DATABASE_URL
        fromDatabase:
          name: apzbot-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: MONOBANK_JAR_ID
        sync: false
      - key: MONOBANK_API_TOKEN
        sync: false

databases:
  - name: apzbot-db
    plan: free
